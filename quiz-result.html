<script>
// ── Result data for every quiz type ──
var RESULTS = {
    'character-match': {
        'bella': {
            name: 'Bella Swan',
            desc: 'You got BELLA. Quietly observant, fiercely loyal, and willing to give up everything for the people \u2014 and the life \u2014 you\'ve chosen. You don\'t need to be the loudest person in the room to be the most decided one in it. Once you commit, there\'s no talking you out of it.'
        },
        'edward': {
            name: 'Edward Cullen',
            desc: 'You got EDWARD. Intense, protective, and a little haunted by the idea that you might be dangerous to the people you love most. You hold yourself to an impossible standard \u2014 controlled on the outside, quietly at war with yourself underneath. Once you let someone in, you rearrange your whole existence around them.'
        },
        'jacob': {
            name: 'Jacob Black',
            desc: 'You got JACOB. Warm, loyal, and impossible to ignore \u2014 you show up, every time, without being asked twice. You feel everything at full volume, and you\'d rather fight for what you want than quietly accept losing it. Your heart runs a little hot, but it\'s never in question.'
        },
        'alice': {
            name: 'Alice Cullen',
            desc: 'You got ALICE. Sharp, quick, and always three steps ahead of everyone else in the room. You see what\'s coming before anyone else does, and you plan for it \u2014 precisely, elegantly, without wasted motion. Underneath the confidence is someone who cares more than she lets on.'
        },
        'rosalie': {
            name: 'Rosalie Hale',
            desc: 'You got ROSALIE. Confident, sharp-tongued, and completely unwilling to pretend to be softer than you are. You say what everyone else is thinking, you don\'t apologize for your standards, and you\'re still mourning a life you can\'t fully get back \u2014 even if you\'d never admit it out loud.'
        },
        'carlisle': {
            name: 'Carlisle Cullen',
            desc: 'You got CARLISLE. Wise, patient, and the person everyone quietly relies on to hold things together. You lead with compassion rather than force, and you\'ve built a family out of people who needed one \u2014 not because you had to, but because it\'s simply who you are.'
        }
    }
};

var CLASSIC_DESC = {
    'Cullen 🧛':'You exist between worlds — powerful yet restrained, ancient yet young at heart. You have chosen the harder path, and it has made you extraordinary. The forest knows your name.',
    'Volturi 🩸':'You are order. You are consequence. Millennia of watching the world taught you that power without structure is chaos — and chaos serves no one. They fear you. They should.',
    'Wolf Pack 🐺':'You are instinct, loyalty, and fire. The forest is your home and your people are your everything. You would die for them without hesitation — and they know it.'
};

window.addEventListener('DOMContentLoaded', function(){
    var params = new URLSearchParams(window.location.search);
    var type = params.get('type');
    var result = params.get('result');

    var titleEl = document.getElementById('result-title');
    var nameEl = document.getElementById('result-display');
    var descEl = document.getElementById('result-desc');
    var ctaEl = document.getElementById('cta-line');

    if (type && RESULTS[type] && result && RESULTS[type][result]) {
        var data = RESULTS[type][result];
        titleEl.textContent = '💫 Your Result Is In';
        nameEl.textContent = data.name;
        descEl.textContent = data.desc;
        ctaEl.innerHTML = 'Want more? <a href="/blog/twilight-cast">Meet the actors who brought them to life →</a>';
    } else {
        // fallback: classic coven quiz via localStorage
        var r = localStorage.getItem('twilight_quiz_result') || 'Cullen 🧛';
        titleEl.textContent = '🩸 Your Fate Is Revealed';
        nameEl.textContent = r;
        descEl.textContent = CLASSIC_DESC[r] || CLASSIC_DESC['Cullen 🧛'];
        ctaEl.innerHTML = 'Want more? <a href="/blog/forks">Explore the real Forks, Washington →</a>';
    }

    document.getElementById('share-btn').addEventListener('click', function(){
        var shareData = {
            title: 'My TwilightVibes Quiz Result',
            text: 'I got "' + nameEl.textContent + '" — take the quiz yourself:',
            url: window.location.href
        };
        if (navigator.share) {
            navigator.share(shareData).catch(function(){});
        } else {
            navigator.clipboard.writeText(shareData.text + ' ' + shareData.url).then(function(){
                var btn = document.getElementById('share-btn');
                var original = btn.textContent;
                btn.textContent = '✅ Link Copied!';
                setTimeout(function(){ btn.textContent = original; }, 2000);
            });
        }
    });
});
