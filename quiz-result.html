<script>
// ── Result data for every quiz type ──
var RESULTS = {
    'kdrama-boyfriend': {
        'goblin': {
            name: 'Kim Shin — The Goblin',
            desc: 'You got THE GOBLIN. 939 years of waiting, and he\'d do it all again for you. Your soulmate is patient, quietly devastated by love, and would burn down an entire timeline to keep you safe. If Edward Cullen had a K-Drama cousin, it\'s him — immortal, tortured, and completely, hopelessly yours.'
        },
        'captain-ri': {
            name: 'Captain Ri Jeong-hyeok',
            desc: 'You got CAPTAIN RI. He will literally land in your village if that\'s what it takes. Steady, quietly romantic, and the kind of devoted that shows up in small daily gestures rather than grand declarations — until the grand declaration happens anyway, and it wrecks you completely.'
        },
        'vincenzo': {
            name: 'Vincenzo Cassano',
            desc: 'You got VINCENZO. Mafia consigliere, impeccably dressed, will absolutely ruin anyone who hurts you — legally, financially, or otherwise. He pretends not to have a heart. He has the biggest one in the room. Dangerous, controlled, and completely loyal once you\'re his.'
        }
    },
    'queen-of-tears': {
        'hyunwoo': {
            name: 'Baek Hyun-woo',
            desc: 'You got HYUN-WOO. Quiet, endlessly patient, the kind of person who keeps showing up long after showing up stopped being convenient. He doesn\'t announce his love — he proves it, over and over, in a hundred small unglamorous ways. Underrated as a personality type. Immaculate as a partner.'
        },
        'haein': {
            name: 'Hong Hae-in',
            desc: 'You got HAE-IN. Fierce, proud, and terrified of being seen as weak — which is exactly why it means everything when you finally let someone in. You love hard, even when you pretend you don\'t. Anyone who earns your loyalty has earned something rare.'
        }
    },
    'edward-vs-oppa': {
        'edward': {
            name: 'Team Edward',
            desc: 'Mystery, intensity, and a love that rearranges his entire existence around you. You want devotion with a little danger in it — the kind of love that feels inevitable, cosmic, slightly terrifying in the best way.'
        },
        'oppa': {
            name: 'Team Oppa',
            desc: 'Soft-spoken, patient, remembers exactly how you take your coffee. You want a love that shows up quietly and consistently — steady warmth over dramatic gestures, though he\'ll still give you the monologue when it counts.'
        },
        'both': {
            name: 'Team Both, No Regrets',
            desc: 'You refuse to choose, and honestly? Valid. You want the intensity AND the softness — the vampire\'s devotion with the oppa\'s emotional availability. High standards. No apologies.'
        }
    }
};

var CLASSIC_DESC = {
    'Cullen 🧛':'You exist between worlds — powerful yet restrained, ancient yet young at heart. You have chosen the harder path, and it has made you extraordinary. The forest knows your name.',
    'Volturi 🩸':'You are order. You are consequence. Millennia of watching the world taught you that power without structure is chaos — and chaos serves no one. They fear you. They should.',
    'Wolf Pack 🐺':'You are instinct, loyalty, and fire. The forest is your home and your people are your everything. You would die for them without hesitation — and they know it.'
};

window.addEventListener('DOMContentLoaded', function(){
    var params = new URLSearchParams(window.location.search);
    var type = params.get('type');
    var result = params.get('result');

    var titleEl = document.getElementById('result-title');
    var nameEl = document.getElementById('result-display');
    var descEl = document.getElementById('result-desc');
    var ctaEl = document.getElementById('cta-line');

    if (type && RESULTS[type] && result && RESULTS[type][result]) {
        var data = RESULTS[type][result];
        titleEl.textContent = '💫 Your Result Is In';
        nameEl.textContent = data.name;
        descEl.textContent = data.desc;
        ctaEl.innerHTML = 'Curious where the original obsession started? <a href="/blog/forks">Read why Twilight girls love K-Drama →</a>';
    } else {
        // fallback: classic coven quiz via localStorage
        var r = localStorage.getItem('twilight_quiz_result') || 'Cullen 🧛';
        titleEl.textContent = '🩸 Your Fate Is Revealed';
        nameEl.textContent = r;
        descEl.textContent = CLASSIC_DESC[r] || CLASSIC_DESC['Cullen 🧛'];
        ctaEl.innerHTML = 'Want more? <a href="/blog/forks">Explore the real Forks, Washington →</a>';
    }

    document.getElementById('share-btn').addEventListener('click', function(){
        var shareData = {
            title: 'My TwilightVibes Quiz Result',
            text: 'I got "' + nameEl.textContent + '" — take the quiz yourself:',
            url: window.location.href
        };
        if (navigator.share) {
            navigator.share(shareData).catch(function(){});
        } else {
            navigator.clipboard.writeText(shareData.text + ' ' + shareData.url).then(function(){
                var btn = document.getElementById('share-btn');
                var original = btn.textContent;
                btn.textContent = '✅ Link Copied!';
                setTimeout(function(){ btn.textContent = original; }, 2000);
            });
        }
    });
});
