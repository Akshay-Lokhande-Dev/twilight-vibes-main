name: One-off Twilight Cast SEO Update

on:
  push:
    paths:
      - .github/workflows/twilight-cast-oneoff.yml

permissions:
  contents: write

jobs:
  update-cast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update cast page
        shell: python
        run: |
          from pathlib import Path

          path = Path("blog/twilight-cast.html")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "<title>The Twilight Saga Cast: Full Cast List & Where They Are Now (2026) | TwilightVibes</title>": "<title>Twilight Cast (2026): Full Cast, Characters & Where They Are Now | TwilightVibes</title>",
              '<meta name="description" content="The complete cast of The Twilight Saga — Kristen Stewart, Robert Pattinson, Taylor Lautner, Ashley Greene, Peter Facinelli, Anna Kendrick, the Volturi, and every actor across all 5 films. Current projects, relationship news, and where they are now in 2026.">': '<meta name="description" content="Meet the full Twilight cast: Kristen Stewart, Robert Pattinson, Taylor Lautner, the Cullens, Volturi and more. See who played each character and where the cast is now.">',
              '<meta property="og:title" content="Twilight Cast: Every Actor & Character | Where Are They Now 2026">': '<meta property="og:title" content="Twilight Cast (2026): Full Cast, Characters & Where They Are Now">',
              '<meta property="og:description" content="Complete guide to every Twilight Saga cast member — all 5 films, character breakdowns, and where they are now in 2026.">': '<meta property="og:description" content="Full Twilight cast and character guide across all five films, with the core cast, Cullens, Volturi, wolf pack and key Forks characters.">',
              '<meta name="twitter:title" content="Twilight Cast: Every Actor & Character | Where Are They Now 2026">': '<meta name="twitter:title" content="Twilight Cast (2026): Full Cast, Characters & Where They Are Now">',
              '<meta name="twitter:description" content="Complete guide to every Twilight Saga cast member across all 5 films, with character breakdowns and career updates.">': '<meta name="twitter:description" content="Full Twilight cast and character guide across all five films, including the Cullens, Volturi, wolf pack and Forks characters.">',
              '"headline": "The Twilight Saga Cast: Full Cast List and Where They Are Now (2026)"': '"headline": "Twilight Cast (2026): Full Cast, Characters and Where They Are Now"',
              '"description": "Complete guide to every Twilight Saga cast member across all five films, with character breakdowns and career updates."': '"description": "Full Twilight cast and character guide across all five films, including the Cullens, Volturi, wolf pack and Forks characters."',
              '<h1>The Twilight Saga Cast</h1>': '<h1>Twilight Cast: Full Cast & Characters</h1>'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected text not found: {old[:100]}")
              text = text.replace(old, new, 1)

          marker = '    <!-- ═══ THE CORE THREE ═══ -->'
          if marker not in text:
              raise SystemExit("Core Three marker not found")

          quick_answer = '''    <section class="quick-answer" aria-labelledby="quick-answer-title">
        <h2 id="quick-answer-title" class="section-title">Twilight Cast at a Glance</h2>
        <p><strong>Who is in the Twilight cast?</strong> The five-film saga is led by Kristen Stewart as Bella Swan, Robert Pattinson as Edward Cullen, and Taylor Lautner as Jacob Black. The wider ensemble includes the Cullen family, the Volturi, the wolf pack and Bella's friends and family in Forks.</p>
        <div class="quick-cast-table-wrap">
            <table class="quick-cast-table">
                <thead><tr><th>Actor</th><th>Character</th><th>Films</th></tr></thead>
                <tbody>
                    <tr><td>Kristen Stewart</td><td>Bella Swan</td><td>All 5</td></tr>
                    <tr><td>Robert Pattinson</td><td>Edward Cullen</td><td>All 5</td></tr>
                    <tr><td>Taylor Lautner</td><td>Jacob Black</td><td>All 5</td></tr>
                    <tr><td>Ashley Greene</td><td>Alice Cullen</td><td>All 5</td></tr>
                    <tr><td>Peter Facinelli</td><td>Carlisle Cullen</td><td>All 5</td></tr>
                    <tr><td>Elizabeth Reaser</td><td>Esme Cullen</td><td>All 5</td></tr>
                    <tr><td>Nikki Reed</td><td>Rosalie Hale</td><td>All 5</td></tr>
                    <tr><td>Kellan Lutz</td><td>Emmett Cullen</td><td>All 5</td></tr>
                    <tr><td>Jackson Rathbone</td><td>Jasper Hale</td><td>All 5</td></tr>
                    <tr><td>Anna Kendrick</td><td>Jessica Stanley</td><td>All 5</td></tr>
                    <tr><td>Michael Sheen</td><td>Aro</td><td>New Moon–Breaking Dawn Part 2</td></tr>
                </tbody>
            </table>
        </div>
        <div class="editorial-note"><strong>Editorial note:</strong> This guide separates the established film cast from current entertainment updates. Rumors are not presented as confirmed casting or production news.</div>
    </section>

'''

          if 'class="quick-answer"' not in text:
              text = text.replace(marker, quick_answer + marker, 1)

          css_marker = '        /* ── SECTION TITLES ── */'
          css = '''        /* ── QUICK ANSWER ── */
        .quick-answer { margin: 18px 0 42px; padding: 24px; background: #f7f4ec; border: 1px solid #d8d0bd; border-radius: 14px; }
        .quick-answer h2.section-title { margin-top: 0; }
        .quick-cast-table-wrap { overflow-x: auto; margin: 18px 0 20px; }
        .quick-cast-table { width: 100%; border-collapse: collapse; min-width: 560px; background: #fff; color: #111; font-family: Lora, Georgia, serif; font-size: .94rem; }
        .quick-cast-table th, .quick-cast-table td { padding: 11px 13px; border-bottom: 1px solid #e4ded0; text-align: left; }
        .quick-cast-table th { background: #eee8db; font-family: 'Playfair Display', serif; font-weight: 700; }
        .quick-cast-table tr:last-child td { border-bottom: 0; }
        .editorial-note { padding: 14px 16px; border-left: 3px solid var(--steel); background: #fff; color: #222; font-size: .9rem; line-height: 1.65; }

'''
          if css_marker not in text:
              raise SystemExit("CSS insertion marker not found")
          if '.quick-answer {' not in text:
              text = text.replace(css_marker, css + css_marker, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/twilight-cast.html
          git rm .github/workflows/twilight-cast-oneoff.yml
          git commit -m "Improve Twilight cast page SEO and quick answers [skip ci]"
          git push