name: Apply Safe HTML Patch

on:
  workflow_dispatch:
    inputs:
      patch_path:
        description: "Path to a patch JSON file, e.g. patches/where-to-watch-twilight.patch.json"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate patch path
        env:
          PATCH_PATH: ${{ inputs.patch_path }}
        run: |
          case "$PATCH_PATH" in
            patches/*.patch.json) ;;
            *) echo "Patch path must be under patches/ and end with .patch.json"; exit 1 ;;
          esac
          test -f "$PATCH_PATH"

      - name: Apply patch
        run: python3 scripts/apply-patch.py "${{ inputs.patch_path }}"

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply HTML patch"
          git push origin HEAD:main
